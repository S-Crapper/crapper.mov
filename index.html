<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>crapper.mov</title>
    <meta name="description" content="its really cool here.... click m..y link.">
    <link rel="stylesheet" href="style/main.css">
</head>
<body>
    <div class="app-shell">
        <div id="sidebar-container"></div>
        <main class="content">
            <h1>welsocem to the coolest place ever </h1>
            <p>ok</p>
			<img src="./images/continue.png" width="100%" height="100%">
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetch('sidebar.html')
                .then(function (response) {
                    if (!response.ok) throw new Error('Failed to load sidebar');
                    return response.text();
                })
                .then(function (html) {
                    document.getElementById('sidebar-container').innerHTML = html;
                    attachCopyButton();
                })
                .catch(function (error) {
                    console.error(error);
                });

            function attachCopyButton() {
                var button = document.querySelector('.copy-code-button');
                var code = document.querySelector('.sidebar-code');
                if (!button || !code) return;
                button.addEventListener('click', function () {
                    var text = code.textContent.trim();
                    navigator.clipboard.writeText(text).then(function () {
                        button.textContent = 'copied';
                        setTimeout(function () {
                            button.textContent = 'copy';
                        }, 1200);
                    });
                });
            }
        });
    </script>
</body>
</html>
